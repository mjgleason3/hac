[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hac-prototype"
version = "0.1.0"
description = "Hierarchical Agent Contracts: composable governance for multi-agent systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "HAC contributors"}]
keywords = ["agents", "formal-methods", "contracts", "alignment", "runtime-verification"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
media = ["Pillow>=10"]

[project.scripts]
hac = "hac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
